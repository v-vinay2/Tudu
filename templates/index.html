<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tudu App</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #f9fafc, #eef1f6);
        min-height: 100vh;
        padding-top: 3rem;
      }
      .quote {
        font-weight: 600;
        text-align: center;
        margin-bottom: 2rem;
        color: #444;
      }
      .card {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }
      .card-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      ul {
        list-style: none;
        padding-left: 0;
        margin: 0;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.6rem 0.8rem;
        border-bottom: 1px solid #eee;
        transition: background 0.2s ease;
      }
      li:hover {
        background: #f8f9fa;
        border-radius: 0.5rem;
      }
      .btn-success {
        border-radius: 0.5rem;
        padding: 0.4rem 1rem;
      }
      .delete-todo,
      .delete-list {
        border: none;
        background: transparent;
        color: #e74c3c;
        font-size: 1.2rem;
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .delete-todo:hover,
      .delete-list:hover {
        transform: scale(1.2);
      }
      .completed {
        text-decoration: line-through;
        color: #999;
      }
      #error.hidden,
      #error.d-none {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Motivation -->
      <h3 class="quote">DO IT NOW. SOMETIMES LATER BECOMES NEVER.</h3>

      <div class="row justify-content-center">
        <!-- Todo Lists -->
        <div class="col-md-5 mb-4">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title">📂 Todo Lists</h4>
              <form
                action="/lists/create"
                method="POST"
                id="list-form"
                class="d-flex gap-2 mb-3"
              >
                <input
                  type="text"
                  name="todolist"
                  class="form-control"
                  id="todolist-input"
                  placeholder="New List"
                  data-id="{{ active_list.id }}"
                />
                <button type="submit" class="btn btn-success">Add</button>
              </form>
              <ul id="lists">
                {% for list in lists %}
                <li>
                  <div>
                    <input
                      type="checkbox"
                      data-id="{{ list.id }}"
                      class="form-check-input list-check-completed me-2"
                      {%
                      if
                      list.completed
                      %}
                      checked
                      {%
                      endif
                      %}
                    />
                    <a href="/lists/{{ list.id }}">{{ list.name }}</a>
                  </div>
                  <button class="delete-list" data-id="{{ list.id }}">
                    &times;
                  </button>
                </li>
                {% endfor %}
              </ul>
            </div>
          </div>
        </div>

        <!-- Todo Items -->
        <div class="col-md-5 mb-4">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title">✅ Tasks</h4>
              <form
                action="/todos/create"
                method="POST"
                id="todo-form"
                class="d-flex gap-2 mb-3"
              >
                <input
                  id="list_id"
                  type="hidden"
                  value="{{ active_list.id }}"
                />
                <input
                  id="description"
                  type="text"
                  name="description"
                  class="form-control"
                  placeholder="Task description"
                />
                <button type="submit" class="btn btn-success">Add</button>
              </form>

              <div id="error" class="alert alert-danger hidden">
                An error occurred, please try again.
              </div>

              <h5 class="mt-3">{{ active_list.name }}</h5>
              <ul id="todos">
                {% for todo in todos %}
                <li>
                  <div>
                    <input
                      data-id="{{ todo.id }}"
                      class="form-check-input todo-check-completed me-2"
                      type="checkbox"
                      {%
                      if
                      todo.completed
                      %}
                      checked
                      {%endif%}
                    />
                    <span class="{% if todo.completed %}completed{% endif %}"
                      >{{ todo.description }}</span
                    >
                  </div>
                  <button class="delete-todo" data-id="{{ todo.id }}">
                    &times;
                  </button>
                </li>
                {% endfor %}
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your full JS logic -->
    <script>
      // Handle list checkbox completion
      const listCheckboxes = document.querySelectorAll(".list-check-completed");
      for (let i = 0; i < listCheckboxes.length; i++) {
        const checkbox = listCheckboxes[i];
        checkbox.onchange = function (e) {
          if (e.target.checked) {
            const listId = e.target.dataset.id;
            fetch("/lists/" + listId + "/set-completed", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
            })
              .then(() => {
                document.getElementById("error").className =
                  "alert alert-danger hidden";
                const todoCheckboxes = document.querySelectorAll(
                  ".todo-check-completed"
                );
                for (let i = 0; i < todoCheckboxes.length; i++) {
                  todoCheckboxes[i].checked = true;
                }
              })
              .catch(() => {
                document.getElementById("error").className =
                  "alert alert-danger";
              });
          }
        };
      }

      // Handle todo checkbox completion
      const todoCheckboxes = document.querySelectorAll(".todo-check-completed");
      for (let i = 0; i < todoCheckboxes.length; i++) {
        const checkbox = todoCheckboxes[i];
        checkbox.onchange = function (e) {
          const newCompleted = e.target.checked;
          const todoId = e.target.dataset.id;
          fetch("/todos/" + todoId + "/set-completed", {
            method: "POST",
            body: JSON.stringify({ completed: newCompleted }),
            headers: { "Content-Type": "application/json" },
          })
            .then(() => {
              document.getElementById("error").className =
                "alert alert-danger hidden";
            })
            .catch(() => {
              document.getElementById("error").className = "alert alert-danger";
            });
        };
      }

      // Handle delete todo
      const deleteTodoBtns = document.querySelectorAll(".delete-todo");
      for (let i = 0; i < deleteTodoBtns.length; i++) {
        const deleteBtn = deleteTodoBtns[i];
        deleteBtn.onclick = function (e) {
          const todoId = e.target.dataset.id;
          fetch("/todos/" + todoId + "/delete", { method: "DELETE" })
            .then(() => {
              e.target.parentElement.remove();
              document.getElementById("error").className =
                "alert alert-danger hidden";
            })
            .catch(() => {
              document.getElementById("error").className = "alert alert-danger";
            });
        };
      }

      // Handle delete list
      const deleteListBtns = document.querySelectorAll(".delete-list");
      for (let i = 0; i < deleteListBtns.length; i++) {
        const deleteBtn = deleteListBtns[i];
        deleteBtn.onclick = function (e) {
          const listId = e.target.dataset.id;
          fetch("/lists/" + listId + "/delete", { method: "DELETE" })
            .then(() => {
              e.target.parentElement.remove();
              document.getElementById("error").className =
                "alert alert-danger hidden";
              window.location.reload(true);
            })
            .catch(() => {
              document.getElementById("error").className = "alert alert-danger";
            });
        };
      }

      // Handle add todo
      document.getElementById("todo-form").onsubmit = function (e) {
        e.preventDefault();
        fetch("/todos/create", {
          method: "POST",
          body: JSON.stringify({
            description: document.getElementById("description").value,
            list_id: document.getElementById("list_id").value,
          }),
          headers: { "Content-Type": "application/json" },
        })
          .then((response) => response.json())
          .then((jsonResponse) => {
            const liItem = document.createElement("LI");
            liItem.innerHTML = jsonResponse["description"];
            document.getElementById("todos").appendChild(liItem);
            document.getElementById("error").className =
              "alert alert-danger hidden";
            window.location.reload(true);
          })
          .catch(() => {
            document.getElementById("error").className = "alert alert-danger";
          });
      };

      // Handle add list
      document.getElementById("list-form").onsubmit = function (e) {
        e.preventDefault();
        fetch("/lists/create", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("todolist-input").value,
          }),
          headers: { "Content-Type": "application/json" },
        })
          .then((response) => response.json())
          .then((jsonResponse) => {
            const liItem = document.createElement("LI");
            liItem.innerHTML = jsonResponse["name"];
            document.getElementById("lists").appendChild(liItem);
            document.getElementById("error").className =
              "alert alert-danger hidden";
            window.location.reload(true);
          })
          .catch(() => {
            document.getElementById("error").className = "alert alert-danger";
          });
      };
    </script>
  </body>
</html>
